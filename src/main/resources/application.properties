spring.application.name=dispatch-load-balancer
server.port=${PORT:8080}

# Database: in-memory H2 by default (zero setup). For PostgreSQL set:
#   DB_URL=jdbc:postgresql://host:5432/dbname  DB_USER=...  DB_PASSWORD=...
spring.datasource.url=${DB_URL:jdbc:h2:mem:dispatch;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
